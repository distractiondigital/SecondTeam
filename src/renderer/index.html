<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Second Team</title>
    <!--
      Local-only: the UI may load only its own files and cannot call out to the internet.
      From Milestone 6, ComfyUI traffic goes through the main process over IPC, so this stays strict.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

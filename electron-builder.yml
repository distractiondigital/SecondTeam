# Windows installer (npm run dist → release\Second Team Setup <version>.exe).
# The renderer's libraries are bundled by electron-vite, so the app needs no node_modules at runtime.
# The AI engine and models are NOT in the installer: the in-app setup wizard downloads them into
# %LOCALAPPDATA%\SecondTeam\backend (or a folder the user picks), outside the install folder, so
# updating or uninstalling the app never deletes them.
appId: com.secondteam.app
productName: Second Team
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - backend/**/*
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: true # install for all users into Program Files (one admin prompt at install/update); no install-mode page
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Second Team
  deleteAppDataOnUninstall: false
  artifactName: ${productName} Setup ${version}.${ext}

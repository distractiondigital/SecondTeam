# Windows installer (npm run dist → release\Second Team Setup <version>.exe).
# The renderer's libraries are bundled by electron-vite, so the app needs no node_modules at runtime.
# The AI engine and models are NOT in the installer: the in-app setup wizard downloads them into
# %LOCALAPPDATA%\SecondTeam\backend (or a folder the user picks), outside the install folder, so
# updating or uninstalling the app never deletes them.
appId: com.secondteam.app
productName: Second Team
copyright: Copyright © 2026 Distraction Digital
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - backend/**/*
  - figures/**/*
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: true # install for all users into Program Files (one admin prompt at install/update); no install-mode page
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Second Team
  deleteAppDataOnUninstall: false
  artifactName: ${productName} Setup ${version}.${ext}

# Mac (npm run dist:mac, on a Mac; normally built by GitHub Actions: .github/workflows/mac.yml).
# Apple Silicon only. Ad-hoc signed (identity '-'), not notarized: macOS asks to confirm the first
# launch of each version (System Settings → Privacy & Security → Open Anyway; see docs/MAC.md).
# The AI engine isn't part of the Mac version yet.
mac:
  target:
    - target: dmg
      arch: arm64
  icon: build/icon.png
  category: public.app-category.video
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName} ${version} (Apple Silicon).${ext}
dmg:
  title: ${productName} ${version}
